name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 6am

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The runner image ships an old setuptools; the audit covers the whole environment,
      # so bring the tooling current first and audit what the project really pulls in.
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install pip-audit
      - run: pip install .
      - run: pip-audit

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit[toml]
      - run: bandit -r lore/ -c pyproject.toml -ll
