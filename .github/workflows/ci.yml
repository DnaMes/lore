name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # pytest-cov is required: pyproject [tool.pytest] addopts injects --cov
        run: pip install -e . pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        # ruff replaces black + isort + flake8 (config lives in pyproject)
        # Pinned: an unpinned ruff changes formatting rules under us and turns main red
        # without any code change. Bump deliberately in its own commit.
        run: pip install "ruff==0.16.8" bandit[toml]

      - name: ruff format (check)
        run: ruff format --check .

      - name: ruff lint
        run: ruff check .

      - name: bandit
        run: bandit -r lore/ -c pyproject.toml -ll

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      # Prove the sdist installs and ships scripts/ -- run entirely outside the checkout
      # so nothing can accidentally import from the source tree.
      - name: Install sdist in a fresh venv (outside the checkout)
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$workdir"
          sdist_dir="$(find "$workdir" -maxdepth 1 -mindepth 1 -type d)"
          python -m venv "$workdir/venv"
          "$workdir/venv/bin/python" -m pip install "$PWD"/dist/*.tar.gz
          cd "$sdist_dir"
          "$workdir/venv/bin/lore" --version
          "$workdir/venv/bin/lore-session" --help
          "$workdir/venv/bin/python" scripts/smoke_install.py --help
