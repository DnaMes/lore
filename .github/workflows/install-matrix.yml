name: Install matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Locate wheel (portable glob)
        id: locate-wheel
        shell: python
        run: |
          import glob
          import os
          wheels = sorted(glob.glob(os.path.join("dist", "*.whl")))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one wheel, found: %r" % wheels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("wheel=%s\n" % wheels[0])

      - name: Smoke the wheel
        run: python scripts/smoke_install.py --wheel ${{ steps.locate-wheel.outputs.wheel }}

  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Locate wheel (portable glob)
        id: locate-wheel
        shell: python
        run: |
          import glob
          import os
          wheels = sorted(glob.glob(os.path.join("dist", "*.whl")))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one wheel, found: %r" % wheels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("wheel=%s\n" % wheels[0])

      - name: Smoke with semantic extra
        run: python scripts/smoke_install.py --wheel ${{ steps.locate-wheel.outputs.wheel }} --extra semantic

  pipx-from-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pipx is preinstalled on the runner image.
      - name: Install from local tree (pull_request)
        if: github.event_name == 'pull_request'
        run: pipx install .

      - name: Install from pushed commit (push/dispatch)
        if: github.event_name != 'pull_request'
        run: pipx install "git+https://github.com/${{ github.repository }}@${{ github.sha }}"

      - name: Smoke the installed package
        run: python scripts/smoke_install.py --installed
