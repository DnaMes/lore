name: Tests

on: [push, pull_request]

jobs:
  test:
    # Unique check name: ci.yml also has a matrix job `test`, so without this both
    # workflows would publish `test (3.11)` / `test (3.12)` and a required check could
    # not tell them apart.
    name: coverage (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" || pip install -e .
      - run: pip install pytest pytest-cov
      - run: python -m pytest tests/ -x -q --cov=lore --cov-fail-under=80
