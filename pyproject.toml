[build-system]
# setuptools>=77: first release that accepts SPDX license strings (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lore"
dynamic = ["version"]
description = "Lore — local-first archive and shared agent memory for your AI coding sessions across Claude, Cursor, Gemini, Codex, Aider, and more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "André Semek", email = "erdna1982@gmail.com"}
]
keywords = ["ai", "chat-history", "session-management", "claude", "gemini", "cursor", "codex", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = [
    "flask>=3.0.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
    "nh3>=0.2.0",

    "google-generativeai>=0.3.0,<1.0.0",
    "google-auth>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# Local semantic search — a small CPU-only ONNX model (no torch) plus
# sqlite-vec for native KNN over the session archive. Both optional; without
# them search degrades to FTS-only.
semantic = ["fastembed>=0.3", "sqlite-vec>=0.1.9"]
# Everything needed to run the test suite, lint, and type-check locally.
# Mirrors what CI installs; fastembed + sqlite-vec are included so the semantic
# tests run for real instead of being skipped. `pip install -e ".[dev]"`.
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.6",
    "mypy>=1.8",
    "pre-commit>=3,<5",
    "bandit[toml]>=1.7",
    "fastembed>=0.3",
    "sqlite-vec>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/DnaMes/lore"
Repository = "https://github.com/DnaMes/lore"
Issues = "https://github.com/DnaMes/lore/issues"

[project.scripts]
lore = "lore_cli:main"
lore-session = "lore_session_cli:main"
lore-web = "lore.cli.web:main"
lore-mcp = "lore.cli.mcp:main_sync"
lore-web-probe = "lore.interfaces.live_probe:main"

[tool.setuptools]
py-modules = ["lore_cli", "lore_session_cli"]

[tool.setuptools.dynamic]
# Single source of truth — the version lives in lore/__init__.py.
version = {attr = "lore.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["lore*"]

[tool.setuptools.package-data]
# Vendored web assets (Tailwind, highlight.js) must ship in the wheel.
"lore.interfaces" = ["static/*.js", "static/*.css"]
# Jinja templates served by the web UI (FileSystemLoader resolves from the package).
"lore" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E203"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".claude"]
# B101: assert statements ok in tests.
# B310: urlopen lives only in interfaces/live_probe.py — a deliberate HTTP
#   security-probe tool whose target URL is an operator CLI argument, not
#   untrusted input.
# B608: the three flagged f-string SQL builders (search/engine, storage/memory,
#   storage/search) interpolate only constant column predicates and "?"
#   placeholder runs; every value is bound via parameters, never interpolated.
skips = ["B101", "B310", "B608"]

[tool.ruff.lint.per-file-ignores]
# Embedded JS/CSS strings legitimately contain blank-line whitespace
"lore/utils/themes.py" = ["W293"]
# Lazy imports gated on optional dependency availability
"lore/interfaces/mcp.py" = ["E402"]
"lore/titles/generator.py" = ["E402"]
# Pre-existing unused-locals slated for separate cleanup
"lore/extractors/claude.py" = ["F841"]
"lore_session_cli.py" = ["F841"]

[tool.pytest.ini_options]
addopts = "--cov=lore --cov-config=pyproject.toml --cov-report=term-missing -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lore"]
omit = [
    "lore/llm/*",
    "lore/titles/*",
    "lore/watcher.py",
    "lore/cli/mcp.py",
    "lore/cli/web.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnusedParameter = false
