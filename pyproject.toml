[build-system]
# setuptools>=77: first release that accepts SPDX license strings (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annuli"
dynamic = ["version"]
description = "Annuli — local-first archive and shared agent memory for your AI coding sessions across Claude, Cursor, Gemini, Codex, Aider, and more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "André Semek", email = "erdna1982@gmail.com"}
]
keywords = ["ai", "chat-history", "session-management", "claude", "gemini", "cursor", "codex", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = [
    "flask>=3.0.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
    "msgpack>=1,<2",
    "nh3>=0.2.0",

    "google-auth>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.3.0,<1.0.0"]
ollama = ["ollama>=0.3"]
# Local semantic search — a small CPU-only ONNX model (no torch) plus
# sqlite-vec for native KNN over the session archive. Both optional; without
# them search degrades to FTS-only.
semantic = ["fastembed>=0.3", "sqlite-vec>=0.1.9"]
# Real headless-browser interaction checks (#194). Not part of `dev`: the tests
# skip when playwright or its Chromium build is absent, so the default suite
# stays free of a ~150 MB browser download. Run `playwright install chromium`
# after installing this extra.
browser = ["playwright>=1.40"]
# Decompression for zstd-compressed sources: Codex archived rollouts (.jsonl.zst)
# and Zed thread rows with data_type "zstd". Without it those sources are skipped
# with a warning.
zstd = ["zstandard>=0.22"]

# Everything needed to run the test suite, lint, and type-check locally.
# Mirrors what CI installs; fastembed + sqlite-vec are included so the semantic
# tests run for real instead of being skipped. `pip install -e ".[dev]"`.
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.6",
    "mypy>=1.8",
    "pre-commit>=3,<5",
    "bandit[toml]>=1.7",
    # PyYAML parses the skill frontmatter in tests/test_skill_annuli_memory.py.
    "PyYAML>=6",
    "fastembed>=0.3",
    "sqlite-vec>=0.1.9",
    "google-generativeai>=0.3.0,<1.0.0",
    "ollama>=0.3",
]

[project.urls]
Homepage = "https://github.com/DnaMes/lore"
Repository = "https://github.com/DnaMes/lore"
Issues = "https://github.com/DnaMes/lore/issues"

[project.scripts]
annuli = "annuli_cli:main"
annuli-session = "annuli_session_cli:main"
annuli-web = "annuli.cli.web:main"
annuli-mcp = "annuli.cli.mcp:main_sync"
annuli-web-probe = "annuli.interfaces.live_probe:main"
# Pre-rebrand command names, kept as aliases until usage counts say they are unused.
lore = "annuli_cli:main"
lore-session = "annuli_session_cli:main"
lore-web = "annuli.cli.web:main"
lore-mcp = "annuli.cli.mcp:main_sync"
lore-web-probe = "annuli.interfaces.live_probe:main"

[tool.setuptools]
py-modules = ["annuli_cli", "annuli_session_cli", "lore_cli", "lore_session_cli"]

[tool.setuptools.dynamic]
# Single source of truth — the version lives in annuli/__init__.py.
version = {attr = "annuli.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["annuli*"]

[tool.setuptools.package-data]
# Vendored web assets (Tailwind, highlight.js, tool icons) must ship in the wheel.
"annuli.interfaces" = ["static/*.js", "static/*.css", "static/icons/*"]
# Jinja templates served by the web UI (FileSystemLoader resolves from the package).
"annuli" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E203"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".claude"]
# B101: assert statements ok in tests.
# B310: urlopen lives only in interfaces/live_probe.py — a deliberate HTTP
#   security-probe tool whose target URL is an operator CLI argument, not
#   untrusted input.
# B608: the three flagged f-string SQL builders (search/engine, storage/memory,
#   storage/search) interpolate only constant column predicates and "?"
#   placeholder runs; every value is bound via parameters, never interpolated.
skips = ["B101", "B310", "B608"]

[tool.ruff.lint.per-file-ignores]
# Lazy imports gated on optional dependency availability
"annuli/interfaces/mcp.py" = ["E402"]
"annuli/titles/generator.py" = ["E402"]
# Pre-existing unused-locals slated for separate cleanup
"annuli/extractors/claude.py" = ["F841"]
"annuli_session_cli.py" = ["F841"]

[tool.pytest.ini_options]
addopts = "--cov=annuli --cov-config=pyproject.toml --cov-report=term-missing -q"
testpaths = ["tests"]
markers = [
    "browser: real headless-browser flows; needs the `browser` extra and Chromium",
]

[tool.coverage.run]
source = ["annuli"]
omit = [
    "annuli/llm/*",
    "annuli/titles/*",
    "annuli/watcher.py",
    "annuli/cli/mcp.py",
    "annuli/cli/web.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnusedParameter = false
