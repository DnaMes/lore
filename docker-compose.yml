---
services:
  app:
    build: .
    container_name: lore-app
    restart: unless-stopped
    # Run as the host user so the bind-mounted ~/.lore (owner-only, 0700)
    # stays writable without loosening its permissions. Override via a .env
    # file if your uid/gid differ from 1000.
    user: "${LORE_UID:-1000}:${LORE_GID:-1000}"
    # localhost-bind (sofort nutzbar). Die traefik-labels greifen ZUSÄTZLICH, sobald
    # traefik wieder TLS-certs holen kann (aktuell blockt der container-DNS-bug, s.
    # docs/issues — bis dahin ist 127.0.0.1:5000 der Zugang).
    ports:
      - "127.0.0.1:5000:5000"
    dns:
      - 192.168.50.1
      - 192.168.1.1
    networks:
      - traefik_local
    labels:
      # Locally built image (build: .), no upstream registry → WUD can't track a
      # "latest" version for it. Exclude it so it doesn't error every watch cycle.
      wud.watch: "false"
      traefik.enable: "true"
      traefik.docker.network: traefik_local
      traefik.http.routers.lore.rule: Host(`lore.local.erdlabs.com`)
      traefik.http.routers.lore.entrypoints: websecure
      traefik.http.routers.lore.tls: "true"
      traefik.http.routers.lore.tls.certresolver: dns-cloudflare
      traefik.http.routers.lore.middlewares: local-only@file,secure-headers@file
      traefik.http.services.lore.loadbalancer.server.port: "5000"
    volumes:
      # Mount config directories (ReadOnly)
      - ${HOME}/.claude:/home/ai/.claude:ro
      - ${HOME}/.gemini:/home/ai/.gemini:ro
      - ${HOME}/.codex:/home/ai/.codex:ro
      - ${HOME}/.config/Cursor:/home/ai/.config/Cursor:ro
      - ${HOME}/.config/Code:/home/ai/.config/Code:ro
      - ${HOME}/.local/share/opencode/storage:/home/ai/.local/share/opencode/storage:ro
      - ${HOME}/.local/share/opencode:/home/ai/.local/share/opencode:ro
      - ${HOME}/.copilot:/home/ai/.copilot:ro
      # Mount Lore's data directory (ReadWrite)
      - ${HOME}/.lore:/home/ai/.lore
    environment:
      - HOME=/home/ai
      # Set a stable secret key so sessions survive container restarts.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      # - FLASK_SECRET_KEY=your-secret-key-here
      - AI_HISTORY_RATE_LIMIT_ENABLED=${AI_HISTORY_RATE_LIMIT_ENABLED:-true}
      - AI_HISTORY_RATE_LIMIT_WINDOW_SECONDS=${AI_HISTORY_RATE_LIMIT_WINDOW_SECONDS:-60}
      - AI_HISTORY_RATE_LIMIT_MAX_API_REQUESTS=${AI_HISTORY_RATE_LIMIT_MAX_API_REQUESTS:-240}
      - AI_HISTORY_RATE_LIMIT_SEARCH_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_SEARCH_PER_WINDOW:-180}
      - AI_HISTORY_RATE_LIMIT_AUDIT_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_AUDIT_PER_WINDOW:-20}
      - AI_HISTORY_RATE_LIMIT_RELOAD_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_RELOAD_PER_WINDOW:-12}
      - AI_HISTORY_JSON_REQUEST_LOGS=${AI_HISTORY_JSON_REQUEST_LOGS:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_local:
    external: true
