# Default, self-contained Lore stack for a clean machine.
# Usage: docker compose up -d
# Optional overlays:
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.traefik.example.yml up -d
services:
  app:
    build: .
    container_name: lore-app
    restart: unless-stopped
    ports:
      # Loopback by default. Set LORE_BIND=0.0.0.0 only if you intentionally expose the host.
      - "${LORE_BIND:-127.0.0.1}:5000:5000"
    volumes:
      # Named volume by default (seeded from image ownership uid 10001). Override with
      # LORE_DATA_DIR=/host/path — that host path must be writable by container uid 10001.
      - ${LORE_DATA_DIR:-lore-data}:/home/ai/.lore
    environment:
      - HOME=/home/ai
      # Set a stable secret so sessions survive restarts:
      # python -c "import secrets; print(secrets.token_hex(32))"
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - LORE_PUBLIC_ORIGINS=${LORE_PUBLIC_ORIGINS:-}
      - LORE_ALLOWED_HOSTS=${LORE_ALLOWED_HOSTS:-}
      - LORE_RATE_LIMIT_ENABLED=${LORE_RATE_LIMIT_ENABLED:-true}
      - LORE_RATE_LIMIT_WINDOW_SECONDS=${LORE_RATE_LIMIT_WINDOW_SECONDS:-60}
      - LORE_RATE_LIMIT_MAX_API_REQUESTS=${LORE_RATE_LIMIT_MAX_API_REQUESTS:-240}
      - LORE_RATE_LIMIT_SEARCH_PER_WINDOW=${LORE_RATE_LIMIT_SEARCH_PER_WINDOW:-180}
      - LORE_RATE_LIMIT_AUDIT_PER_WINDOW=${LORE_RATE_LIMIT_AUDIT_PER_WINDOW:-20}
      - LORE_RATE_LIMIT_RELOAD_PER_WINDOW=${LORE_RATE_LIMIT_RELOAD_PER_WINDOW:-12}
      - LORE_JSON_REQUEST_LOGS=${LORE_JSON_REQUEST_LOGS:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lore-data:
