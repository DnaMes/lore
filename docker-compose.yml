# Default, self-contained Annuli stack for a clean machine.
# Usage: docker compose up -d
# Optional overlays:
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.traefik.example.yml up -d
services:
  app:
    build: .
    container_name: lore-app
    restart: unless-stopped
    ports:
      # Loopback by default. Set ANNULI_BIND=0.0.0.0 only if you intentionally expose the host.
      # ANNULI_PORT changes the host port when 5000 is taken (for example by macOS AirPlay).
      - "${ANNULI_BIND:-${LORE_BIND:-127.0.0.1}}:${ANNULI_PORT:-${LORE_PORT:-5000}}:5000"
    volumes:
      # Named volume by default (seeded from image ownership uid 10001). Override with
      # ANNULI_DATA_DIR=/host/path — that host path must be writable by container uid 10001.
      - ${ANNULI_DATA_DIR:-${LORE_DATA_DIR:-lore-data}}:/home/ai/.annuli
    environment:
      - HOME=/home/ai
      # Set a stable secret so sessions survive restarts:
      # python -c "import secrets; print(secrets.token_hex(32))"
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - ANNULI_PUBLIC_ORIGINS=${ANNULI_PUBLIC_ORIGINS:-${LORE_PUBLIC_ORIGINS:-}}
      - ANNULI_ALLOWED_HOSTS=${ANNULI_ALLOWED_HOSTS:-${LORE_ALLOWED_HOSTS:-}}
      - ANNULI_RATE_LIMIT_ENABLED=${ANNULI_RATE_LIMIT_ENABLED:-${LORE_RATE_LIMIT_ENABLED:-true}}
      - ANNULI_RATE_LIMIT_WINDOW_SECONDS=${ANNULI_RATE_LIMIT_WINDOW_SECONDS:-${LORE_RATE_LIMIT_WINDOW_SECONDS:-60}}
      - ANNULI_RATE_LIMIT_MAX_API_REQUESTS=${ANNULI_RATE_LIMIT_MAX_API_REQUESTS:-${LORE_RATE_LIMIT_MAX_API_REQUESTS:-240}}
      - ANNULI_RATE_LIMIT_SEARCH_PER_WINDOW=${ANNULI_RATE_LIMIT_SEARCH_PER_WINDOW:-${LORE_RATE_LIMIT_SEARCH_PER_WINDOW:-180}}
      - ANNULI_RATE_LIMIT_AUDIT_PER_WINDOW=${ANNULI_RATE_LIMIT_AUDIT_PER_WINDOW:-${LORE_RATE_LIMIT_AUDIT_PER_WINDOW:-20}}
      - ANNULI_RATE_LIMIT_RELOAD_PER_WINDOW=${ANNULI_RATE_LIMIT_RELOAD_PER_WINDOW:-${LORE_RATE_LIMIT_RELOAD_PER_WINDOW:-12}}
      - ANNULI_JSON_REQUEST_LOGS=${ANNULI_JSON_REQUEST_LOGS:-${LORE_JSON_REQUEST_LOGS:-false}}
      # Optional LLM summary configuration. Do NOT put API key values here;
      # use an untracked env_file instead, e.g.:
      #   env_file:
      #     - .env.llm   # with ANNULI_LLM_API_KEY=... inside it
      # Inside a container, 127.0.0.1 is the container itself, not the host.
      # To reach a host Ollama, use host.docker.internal or the compose network service name.
      - ANNULI_SUMMARY_PROVIDER=${ANNULI_SUMMARY_PROVIDER:-${LORE_SUMMARY_PROVIDER:-}}
      - ANNULI_SUMMARY_MODEL=${ANNULI_SUMMARY_MODEL:-${LORE_SUMMARY_MODEL:-}}
      - ANNULI_LLM_BASE_URL=${ANNULI_LLM_BASE_URL:-${LORE_LLM_BASE_URL:-}}
      - ANNULI_LLM_MODEL=${ANNULI_LLM_MODEL:-${LORE_LLM_MODEL:-}}
      - ANNULI_LLM_API_KEY_ENV=${ANNULI_LLM_API_KEY_ENV:-${LORE_LLM_API_KEY_ENV:-}}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    container_name: lore-worker
    restart: unless-stopped
    command: ["annuli", "worker"]
    volumes:
      - ${ANNULI_DATA_DIR:-${LORE_DATA_DIR:-lore-data}}:/home/ai/.annuli
    environment:
      - HOME=/home/ai
      - ANNULI_WORKER_INTERVAL=${ANNULI_WORKER_INTERVAL:-${LORE_WORKER_INTERVAL:-}}
      - ANNULI_WORKER_SUMMARY_DAILY_CAP=${ANNULI_WORKER_SUMMARY_DAILY_CAP:-${LORE_WORKER_SUMMARY_DAILY_CAP:-}}
      - ANNULI_WORKER_EMBED_MESSAGES=${ANNULI_WORKER_EMBED_MESSAGES:-${LORE_WORKER_EMBED_MESSAGES:-}}
      # Optional LLM summary configuration (use env_file for API keys;
      # use host.docker.internal or the compose network service name instead of 127.0.0.1).
      - ANNULI_SUMMARY_PROVIDER=${ANNULI_SUMMARY_PROVIDER:-${LORE_SUMMARY_PROVIDER:-}}
      - ANNULI_SUMMARY_MODEL=${ANNULI_SUMMARY_MODEL:-${LORE_SUMMARY_MODEL:-}}
      - ANNULI_LLM_BASE_URL=${ANNULI_LLM_BASE_URL:-${LORE_LLM_BASE_URL:-}}
      - ANNULI_LLM_MODEL=${ANNULI_LLM_MODEL:-${LORE_LLM_MODEL:-}}
      - ANNULI_LLM_API_KEY_ENV=${ANNULI_LLM_API_KEY_ENV:-${LORE_LLM_API_KEY_ENV:-}}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    healthcheck:
      test: ["CMD", "annuli", "worker", "status", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    cpus: "0.25"
    mem_limit: 4g  # the embed-messages child peaked at ~2.9 GiB; the idle loop needs ~30 MiB
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lore-data:
