# Example Traefik override — copy/adapt for your reverse proxy. Not used by default.
#
# Usage (after creating the external network):
#   docker network create traefik_local
#   docker compose -f docker-compose.yml -f docker-compose.traefik.example.yml up -d
#
# Replace annuli.example.com with your hostname. TRUSTED_PROXY=1 makes Annuli trust
# X-Forwarded-* headers from the proxy; ANNULI_PUBLIC_ORIGINS tells it which public
# origin (and therefore Host header) is legitimate, otherwise it answers 400.
# Annuli has no login: add an auth middleware (e.g. basic auth) to the router below.
services:
  app:
    # Present so `docker compose -f docker-compose.traefik.example.yml config` validates alone.
    build: .
    environment:
      - TRUSTED_PROXY=1
      - ANNULI_PUBLIC_ORIGINS=https://annuli.example.com
    networks:
      - traefik_local
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_local
      traefik.http.routers.annuli.rule: Host(`annuli.example.com`)
      traefik.http.routers.annuli.entrypoints: websecure
      traefik.http.routers.annuli.tls: "true"
      # Optional: cert resolver / middleware names must match your Traefik static config.
      # traefik.http.routers.annuli.tls.certresolver: myresolver
      # traefik.http.routers.annuli.middlewares: secure-headers@file
      traefik.http.services.annuli.loadbalancer.server.port: "5000"

networks:
  # Example external network shared with a Traefik container on the same Docker host.
  traefik_local:
    external: true
